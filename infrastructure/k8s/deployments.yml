# ── Namespace ─────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: trackforge

---
# ── API Gateway Deployment ─────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: trackforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/your-org/trackforge-api-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: trackforge-secrets
                  key: jwt-secret
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8081
            - name: BUG_SERVICE_URL
              value: http://bug-service:8082
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: trackforge
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080

---
# ── Auth Service ──────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: trackforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/your-org/trackforge-auth-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/trackforge_auth
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: trackforge-secrets
                  key: db-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trackforge-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: trackforge-secrets
                  key: jwt-secret
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: SPRING_REDIS_HOST
              value: redis
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: trackforge
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081

---
# ── Bug Service ───────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bug-service
  namespace: trackforge
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bug-service
  template:
    metadata:
      labels:
        app: bug-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: bug-service
          image: ghcr.io/your-org/trackforge-bug-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/trackforge_bugs
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: trackforge-secrets
                  key: db-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trackforge-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: trackforge-secrets
                  key: jwt-secret
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: SPRING_REDIS_HOST
              value: redis
            - name: MINIO_URL
              value: http://minio:9000
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: trackforge-secrets
                  key: openai-api-key
                  optional: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 40
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: bug-service
  namespace: trackforge
spec:
  selector:
    app: bug-service
  ports:
    - port: 8082
      targetPort: 8082

---
# ── Ingress ───────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trackforge-ingress
  namespace: trackforge
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - trackforge.yourdomain.com
      secretName: trackforge-tls
  rules:
    - host: trackforge.yourdomain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: bug-service
                port:
                  number: 8082
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

---
# ── HPA for Bug Service ───────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bug-service-hpa
  namespace: trackforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bug-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# ── Secrets (replace with real values or use Vault) ───────
apiVersion: v1
kind: Secret
metadata:
  name: trackforge-secrets
  namespace: trackforge
type: Opaque
stringData:
  jwt-secret: "CHANGE_ME_256_bit_secret_key_in_production"
  db-username: "postgres"
  db-password: "CHANGE_ME_strong_db_password"
  openai-api-key: ""